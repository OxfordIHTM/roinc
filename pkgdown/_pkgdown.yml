title: roinc

url: https://oxford-ihtm.io/roinc/

development:
  mode: auto

template:
  bootstrap: 5
  bootswatch: sandstone
  theme: breeze-light
  includes:
    in_header: |
      <!-- Google tag (gtag.js) -->
      <script async src="https://www.googletagmanager.com/gtag/js?id=G-T5W5ML7NY8"></script>
      <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());

        gtag('config', 'G-T5W5ML7NY8');
      </script>

home:
  links:
  - text: Read more about LOINC
    href: https://loinc.org/

navbar:
  bg: primary
  type: light
  structure:
    left:  [home, intro, reference, articles, news]
    right: [search, linkedin, mastodon, github]

  components:
    # articles:
    #   text: Articles
    #   menu:
    #   - text: "Figshare workflow"
    #     href: articles/figshare-workflow.html
    #   - text: "Website dataset workflow"
    #     href: articles/website-dataset-workflow.html
    linkedin:
      icon: "fab fa-linkedin fa-lg"
      href: https://www.linkedin.com/company/oxford-ihealth
      aria-label: LinkedIn
    mastodon:
      icon: "fab fa-mastodon fa-lg"
      href: https://mastodon.social/@ihealth
      aria-label: Mastodon

reference:
  - title: Setup API credentials
    contents:
    - roinc_set_credentials

  - title: Terminology Service
    contents:
    - roinc_codesystem
    - roinc_valueset
    - roinc_concept_map
    - roinc_questionnaire

  - title: Search
    contents:
    - roinc_search_loincs
    - roinc_search_answerlists
    - roinc_search_parts
    - roinc_search_groups

  - title: Download
    contents:
    - roinc_download_metadata
    - roinc_download_metadata_version

  - title: Data
    contents:
    - linguistic_variants
    